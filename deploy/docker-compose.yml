# kb_mp 部署架构 —— Docker Compose
# 见 docs/adr/0001-deployment-mysql-milvus-redis.md
# 见 docs/概要设计总纲.md §4.1 中间件层

# 启动顺序（依赖）：
# 1. etcd         (Milvus 元数据)
# 2. minio        (Milvus 对象存储)
# 3. milvus       (依赖 etcd + minio)
# 4. mysql        (Kb_mp 主库)
# 5. redis        (Kb_mp 鉴权位图 + FAQ 缓存)
# 6. app          (Kb_mp FastAPI，依赖 4+5+3)

services:
  # ── Milvus 元数据存储 ─────────────────────────────
  etcd:
    container_name: kb_mp_etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 100000
    volumes:
      - milvus_etcd_data:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    networks:
      - kb_mp_net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Milvus 对象存储 ─────────────────────────────
  minio:
    container_name: kb_mp_minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - milvus_minio_data:/minio_data
    networks:
      - kb_mp_net
    command: minio server /minio_data --address ":9000" --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Milvus 向量库
  # 注意：Windows Docker Desktop 调试时 grpc panic（已在 README 标记）；演示期不强制启动
  milvus:
    container_name: kb_mp_milvus
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - kb_mp_net
    ports:
      - "19530:19530"   # gRPC（langchain-milvus）
      - "9091:9091"     # HTTP 管理
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── Milvus 可视化（仅开发） ─────────────────────────────
  attu:
    container_name: kb_mp_attu
    image: zilliz/attu:v2.4.16
    networks:
      - kb_mp_net
    ports:
      - "8000:3000"    # 浏览器访问 http://localhost:8000
    depends_on:
      - milvus
    profiles: ["dev"]  # 仅 `docker compose --profile dev up` 启动

  # ── MySQL 主库 ─────────────────────────────
  mysql:
    container_name: kb_mp_mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kb_mp
      MYSQL_USER: kb_user
      MYSQL_PASSWORD: kb_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - kb_mp_mysql_data:/var/lib/mysql
    networks:
      - kb_mp_net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kb_user", "-pkb_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis 鉴权位图 + FAQ 缓存 ─────────────────────────────
  redis:
    container_name: kb_mp_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - kb_mp_redis_data:/data
    networks:
      - kb_mp_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── kb_mp FastAPI 应用 ─────────────────────────────
  app:
    container_name: kb_mp_app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: mysql+aiomysql://kb_user:kb_password@mysql:3306/kb_mp
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_COST: "12"
      AUTH_BITMAP_TTL_SECONDS: "300"
      SOURCE_STORAGE_BACKEND: minio
      SOURCE_STORAGE_PREFIX: sources
      SOURCE_MINIO_ENDPOINT: minio:9000
      SOURCE_MINIO_ACCESS_KEY: minioadmin
      SOURCE_MINIO_SECRET_KEY: minioadmin
      SOURCE_MINIO_BUCKET: kb-source-docs
      SOURCE_MINIO_SECURE: "false"
    volumes:
      - kb_mp_storage:/app/storage
    networks:
      - kb_mp_net
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  kb_mp_net:
    driver: bridge

volumes:
  kb_mp_mysql_data:
  kb_mp_redis_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  kb_mp_storage:
