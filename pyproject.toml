[project]
name = "kb-mp"
version = "0.1.0"
description = "知识库管理平台 - FastAPI AI Agent 后端"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "langchain==1.3.10",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    # 新增（Phase 2A 风险报告 H14 修复）
    "bcrypt>=4.2.0",               # M1+M2 密码哈希
    "PyJWT>=2.9.0",                # M1 JWT
    "redis>=5.0.0",                # M1+M3+M4+M6 异步客户端（redis-py 5.x 支持 asyncio）
    "pymilvus>=2.4.0",             # M3+M4 Milvus gRPC 客户端
    "langchain-milvus>=0.1.0",     # M3+M4 LangChain Milvus 集成
    "pypdf>=5.0.0",                # M3 PDF 解析
    "python-docx>=1.1.0",          # M3 Word 解析
    "markdown-it-py>=3.0.0",       # M3 MD 解析
    "langchain-text-splitters>=0.3.0",  # M3 RecursiveTextSplitter
    "apscheduler>=3.10.0",         # M6 定时任务
    "sqlalchemy[asyncio]>=2.0.30", # 包含 asyncmy 扩展（可选 aiomysql）
    "numpy>=1.26.0",               # M5/M6 P95 响应时间百分位计算
]

[project.optional-dependencies]
langgraph = ["langgraph==1.2.11"]
openai = ["langchain-openai==1.3.0"]
mysql = ["sqlalchemy==2.0.50", "aiomysql==0.3.2"]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
