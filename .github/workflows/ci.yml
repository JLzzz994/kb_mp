name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: kb_mp
          MYSQL_USER: kb_user
          MYSQL_PASSWORD: kb_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u kb_user -pkb_password" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5
    env:
      DATABASE_URL: mysql+aiomysql://kb_user:kb_password@localhost:3306/kb_mp
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --user uv
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint (ruff format check)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Run unit tests (skip e2e — needs real Milvus + BGE-M3)
        run: uv run pytest --ignore=tests/test_e2e_t7_real_vectorize.py -v
      - name: Run all tests including e2e
        run: uv run pytest -v
        continue-on-error: true

  frontend:
    name: Vue 3 typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  deployment:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare compose env
        run: cp .env.example .env
      - name: Validate deployment compose
        run: docker compose -f deploy/docker-compose.yml config >/dev/null

  source-storage-integration:
    name: real MinIO source-storage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_MINIO_INTEGRATION: "1"
      SOURCE_MINIO_ENDPOINT: localhost:9000
      SOURCE_MINIO_ACCESS_KEY: minioadmin
      SOURCE_MINIO_SECRET_KEY: minioadmin
      SOURCE_MINIO_BUCKET: kb-source-docs-ci
      SOURCE_MINIO_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start MinIO
        run: |
          docker run -d --name kb-source-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-02-28T09-55-16Z \
            server /data --address ":9000"
          for i in {1..30}; do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kb-source-minio
          exit 1
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --user uv
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run real MinIO integration
        run: uv run pytest tests/test_source_storage_minio_integration.py -v
