name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: kb_mp
          MYSQL_USER: kb_user
          MYSQL_PASSWORD: kb_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u kb_user -pkb_password" --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5

    env:
      DATABASE_URL: mysql+aiomysql://kb_user:kb_password@localhost:3306/kb_mp
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-change-me

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --user uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff format check)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Run unit tests (skip e2e — needs real Milvus + BGE-M3)
        run: uv run pytest --ignore=tests/test_e2e_t7_real_vectorize.py -v

      - name: Run all tests including e2e
        run: uv run pytest -v
        continue-on-error: true  # e2e 需要 Milvus + BGE-M3 真实服务，演示环境失败属正常

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
